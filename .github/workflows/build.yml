name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/universal" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2

      - name: Install the frontend's dependencies
        run: bun install --frozen-lockfile

      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build
        run: bun run build -- -platform "${{ matrix.platform }}"

      - name: Keep the builds
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/
          if-no-files-found: error

      - name: Collect the installers
        # A row builds several architectures into build/<os>-<arch>/, and some
        # names repeat across them (the portable app, install.sh): name the
        # ones that do not carry their architecture.
        run: |
          set -eu
          mkdir -p release
          find build -mindepth 2 -maxdepth 2 -type f \
            \( -name '*.deb' -o -name '*.tar.gz' -o -name '*.dmg' -o -name '*.exe' \) -print0 |
          while IFS= read -r -d '' f; do
            platform=$(basename "$(dirname "$f")")
            name=$(basename "$f")
            case "$name" in
              *amd64*|*arm64*|*universal*) cp "$f" "release/$name" ;;
              *) cp "$f" "release/${name%.*}-$platform.${name##*.}" ;;
            esac
          done
          ls -l release

      - name: Upload them to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --clobber release/*
