name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build renderer and Electron
        run: bunx vite build

      - name: Build release
        run: bunx electron-builder --${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect release output
        shell: bash
        run: ls -la release/

      - name: Collect distributable files
        shell: bash
        run: |
          mkdir -p dist-packages
          if [ "${{ matrix.target }}" = "linux" ]; then
            cp release/*.AppImage dist-packages/ 2>/dev/null || true
            cp release/*.deb dist-packages/ 2>/dev/null || true
            cp release/*.rpm dist-packages/ 2>/dev/null || true
          elif [ "${{ matrix.target }}" = "win" ]; then
            cp release/*.zip dist-packages/ 2>/dev/null || true
          elif [ "${{ matrix.target }}" = "mac" ]; then
            cp release/*.dmg dist-packages/ 2>/dev/null || true
          fi
          ls -la dist-packages/

      - name: Upload distributable artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ matrix.target }}
          path: dist-packages/*
          if-no-files-found: warn

  release:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        id: download
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Inspect artifacts
        id: check
        run: |
          echo "=== downloaded artifacts ==="
          ls -R artifacts/ || true
          echo "=== distributable files ==="
          find artifacts -type f ! -name '*.blockmap' ! -name '*.yml' ! -name '*.yaml'
          count=$(find artifacts -type f ! -name '*.blockmap' ! -name '*.yml' ! -name '*.yaml' | wc -l)
          echo "total_files=$count" >> $GITHUB_OUTPUT
          echo "Total distributable files: $count"

      - name: Create Release and upload assets
        if: steps.check.outputs.total_files != '0'
        run: |
          REPO="Kibidango086/BLBL-music-player"
          TAG="${{ github.ref_name }}"
          echo "Tag: $TAG"

          # Create release (skip if exists)
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --generate-notes \
            --draft=false \
            --prerelease=false \
            2>/dev/null || echo "Release already exists, continuing..."

          # Upload each file (skip blockmap / yaml)
          find artifacts -type f \
            ! -name '*.blockmap' \
            ! -name '*.yml' \
            ! -name '*.yaml' | while read -r file; do
            echo "Uploading: $(basename "$file")"
            gh release upload "$TAG" "$file" \
              --repo "$REPO" \
              --clobber
            echo "  OK: $(basename "$file")"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
